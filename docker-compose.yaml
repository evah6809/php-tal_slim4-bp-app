services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: evah6809
      MYSQL_DATABASE: health-bp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

