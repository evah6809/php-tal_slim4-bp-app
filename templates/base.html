<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血圧管理手帳</title>
    <!-- 💡 ここにPWAのコードを引っ越しさせます！ -->
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/static/sw.js').then(function(registration) {
                    console.log('PWA サービスワーカー登録成功！');
                }).catch(function(err) {
                    console.log('PWA サービスワーカー登録失敗:', err);
                });
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel=\"stylesheet\">
    <style>
        /* Chrome, Safari, Edge, Opera のスピナー（上下矢印）領域を完全に消す */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox のスピナーを消す */
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col text-gray-800">

    <header class="bg-indigo-600 text-white shadow-md print:hidden">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-heartbeat"></i> <a href="/" class="hover:opacity-90">血圧管理手帳</a>
            </h1>
            {% if session.get('user_id') %}
            <nav class="flex gap-6 items-center font-bold text-base">
                <a href="/" class="hover:underline {% if request.path == '/' %}text-yellow-300 font-extrabold text-lg{% endif %}">入力画面</a>
                <a href="/history" class="hover:underline {% if request.path == '/history' %}text-yellow-300 font-extrabold text-lg{% endif %}">履歴手帳</a>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400 mt-auto print:hidden">
        &copy; 2026 血圧管理手帳 All Rights Reserved.
    </footer>

</body>
</html>
